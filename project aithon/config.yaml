# Workplace Safety AI / Computer Vision Configuration
system:
  camera_id: "cam_floor_01"
  fps: 30
  resolution: [1280, 720]

# PPE Detection Settings
ppe:
  enabled: true
  model_path: "models/yolov8n-ppe.pt" # Fallback to standard yolov8n if custom weights absent
  confidence_threshold: 0.45
  iou_threshold: 0.45
  required_ppe:
    - "helmet"
    - "vest"
  # Optional equipment: "goggles", "gloves", "boots"

# Posture & Worker Fatigue Detection (MediaPipe)
posture_fatigue:
  enabled: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  model_complexity: 1 # 0=lite, 1=full, 2=heavy
  thresholds:
    # Ergonomic bending thresholds (degrees)
    trunk_inclination_unsafe_deg: 45.0  # Spine bent forward > 45°
    trunk_inclination_severe_deg: 65.0  # Extreme lumbar load
    neck_flexion_unsafe_deg: 35.0       # Forward head posture / neck strain
    knee_flexion_straight_deg: 30.0     # Straight knees during bending (bad lifting)
    safe_lift_knee_flexion_deg: 60.0    # Good squat/lift knee bend
    # Fatigue indicators
    head_droop_angle_deg: 40.0          # Head tilting down excessively
    fatigue_dwell_frames: 60            # Consecutive frames of drooping/slumping to flag fatigue
    immobility_seconds_threshold: 15.0  # Low movement in one spot indicating exhaustion

# Fall Detection Settings
fall:
  enabled: true
  aspect_ratio_fall_threshold: 0.85    # Bbox Height/Width ratio < 0.85 indicates horizontal lying
  torso_angle_horizontal_deg: 30.0     # Angle between shoulder-hip axis and floor < 30°
  velocity_descent_threshold_px: 25.0  # Rapid vertical drop of keypoints
  confirmation_frames: 10              # Frames persistent on floor before emergency trigger
  recovery_timeout_seconds: 5.0        # Time window to check if worker recovers or remains inactive

# Danger Zone Intrusion Settings
danger_zone:
  enabled: true
  zones_file: "sample_danger_zones.json"
  tracking_point: "feet"               # "feet" (bottom center of bbox) or "centroid"
  enforce_ppe_rules: true

# JSON Output & Streaming Settings
output:
  save_json: true
  output_json_path: "output/detections.json"
  stream_jsonl: true
  jsonl_path: "output/detections.jsonl"
  print_summary_console: true
  api_port: 8000
